<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient( rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.95)), url('https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            width: 550px;
            background: rgba(8, 15, 25, 0.92);
            border: 1px solid #00ffff;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 0 15px #00ffff66, 0 0 35px #00ffff33;
        }
        
        h1 {
            color: #00ffff;
            margin-bottom: 25px;
            text-shadow: 0 0 12px #00ffff;
        }
        
        .subtitle {
            color: #cccccc;
            margin-bottom: 25px;
            font-size: 15px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #00ffff;
            background: #111827;
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        input::placeholder {
            color: #aaaaaa;
        }
        
        button {
            margin-top: 18px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #00ffff;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #00ffff;
        }
        
        #result {
            margin-top: 25px;
            font-size: 28px;
            font-weight: bold;
        }
        
        .safe {
            color: #00ff88;
            text-shadow: 0 0 12px #00ff88;
        }
        
        .phishing {
            color: #ff3b3b;
            text-shadow: 0 0 12px #ff3b3b;
        }
        
        .footer {
            margin-top: 25px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛡️ Phishing URL Detector</h1>

        <p class="subtitle">
            Enter a website URL and check whether it appears safe or suspicious.
        </p>

        <input type="text" id="url" placeholder="https://example.com">

        <button onclick="checkURL()">
        Scan URL
    </button>

        <div id="result"></div>

        <div class="footer">
            Cyber Security Project • URL Threat Detection System
        </div>

    </div>

    <script>
        async function checkURL() {

            const url = document.getElementById("url").value.trim();

            const resultDiv = document.getElementById("result");

            if (url === "") {
                resultDiv.className = "phishing";
                resultDiv.innerHTML = "⚠ Please enter a URL";
                return;
            }

            resultDiv.className = "";
            resultDiv.innerHTML = "🔍 Scanning...";

            try {

                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        url: url
                    })
                });

                const data = await response.json();

                if (data.prediction === "SAFE") {

                    resultDiv.className = "safe";
                    resultDiv.innerHTML = "🟢 SAFE";

                } else if (data.prediction === "PHISHING") {

                    resultDiv.className = "phishing";
                    resultDiv.innerHTML = "🔴 PHISHING";

                } else {

                    resultDiv.className = "phishing";
                    resultDiv.innerHTML = "⚠ Error";

                }

            } catch (error) {

                resultDiv.className = "phishing";
                resultDiv.innerHTML = "⚠ Server Not Reachable";

            }
        }
    </script>

</body>

</html>
